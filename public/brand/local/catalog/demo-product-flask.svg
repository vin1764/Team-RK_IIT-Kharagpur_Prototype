<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Placeholder illustration (Team RK prototype): a plain stainless steel flask with cap. No brand. -->
  <defs>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9aa1a8"/>
      <stop offset="0.25" stop-color="#e6e9ec"/>
      <stop offset="0.5" stop-color="#c3c8cd"/>
      <stop offset="0.8" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#8e959c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#ffffff"/>
  <ellipse cx="200" cy="356" rx="70" ry="10" fill="#000" opacity="0.08"/>
  <!-- cap -->
  <rect x="160" y="40" width="80" height="50" rx="10" fill="url(#steel)" stroke="#8e959c" stroke-width="2"/>
  <path d="M170 52 v26 M184 52 v26 M198 52 v26 M212 52 v26 M226 52 v26" stroke="#8e959c" stroke-width="2" opacity="0.6"/>
  <!-- neck -->
  <rect x="166" y="88" width="68" height="16" fill="#b4babf" stroke="#8e959c" stroke-width="2"/>
  <!-- shoulder and body -->
  <path d="M166 104 Q140 112 140 140 v190 a20 20 0 0 0 20 20 h80 a20 20 0 0 0 20 -20 v-190 Q260 112 234 104 z" fill="url(#steel)" stroke="#8e959c" stroke-width="2"/>
  <!-- bands -->
  <path d="M140 160 h120 M140 312 h120" stroke="#8e959c" stroke-width="2" opacity="0.7"/>
  <!-- highlight -->
  <path d="M160 176 v120" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
</svg>
